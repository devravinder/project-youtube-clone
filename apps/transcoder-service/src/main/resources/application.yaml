spring:
  application:
    name: transcoder-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
    group:
      local-observability: local
  # Host, port and credentials come from SPRING_RABBITMQ_* variables.
  rabbitmq:
    listener:
      simple:
        # Transcoding is heavy: one message in flight per consumer.
        prefetch: 1
        # A failed message goes to the dead-letter queue instead of looping.
        default-requeue-rejected: false

server:
  port: ${SERVER_PORT:3002}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# Empty defaults fail validation; an unresolved ${X} would bind as literal text.
app:
  storage:
    endpoint: ${STORAGE_ENDPOINT:}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    force-path-style: ${STORAGE_FORCE_PATH_STYLE:false}
    raw-bucket: ${STORAGE_RAW_BUCKET:raw-videos}
    hls-bucket: ${STORAGE_HLS_BUCKET:hls-videos}
  transcode:
    work-dir: ${TRANSCODE_WORK_DIR:${java.io.tmpdir}/yt-transcoder}
