spring:
  application:
    name: transcoder-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
    group:
      local-observability: local
  # Host, port and credentials come from SPRING_RABBITMQ_* variables.
  rabbitmq:
    # Lets publishers wait for the broker's confirm (status events, retries).
    publisher-confirm-type: simple
    listener:
      simple:
        # Transcoding is heavy: one message in flight per consumer.
        prefetch: 1
        # A failed message goes to the dead-letter queue instead of looping.
        default-requeue-rejected: false

server:
  port: ${SERVER_PORT:3002}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  # Telemetry export is off unless the local-observability profile turns it on.
  tracing:
    export:
      enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false

# Empty defaults fail validation; an unresolved ${X} would bind as literal text.
app:
  storage:
    endpoint: ${STORAGE_ENDPOINT:}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    force-path-style: ${STORAGE_FORCE_PATH_STYLE:false}
    raw-bucket: ${STORAGE_RAW_BUCKET:raw-videos}
    hls-bucket: ${STORAGE_HLS_BUCKET:hls-videos}
  transcode:
    work-dir: ${TRANSCODE_WORK_DIR:${java.io.tmpdir}/yt-transcoder}
    ffmpeg:
      path: ${FFMPEG_PATH:ffmpeg}
      probe-path: ${FFPROBE_PATH:ffprobe}
      # Empty runs the binaries above; an image runs each call in a container instead.
      docker-image: ${FFMPEG_DOCKER_IMAGE:}
      timeout: ${TRANSCODE_TIMEOUT:30m}
    # Transient failures wait in transcoder.transcode-video.retry for `delay`, then run again.
    # Changing delay changes the retry queue's TTL: delete that queue so it is redeclared.
    retry:
      max-attempts: ${TRANSCODE_MAX_ATTEMPTS:3}
      delay: ${TRANSCODE_RETRY_DELAY:10s}
