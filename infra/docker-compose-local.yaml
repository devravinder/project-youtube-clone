name: youtube-clone-local

services:
  postgres:
    image: postgres:latest
    container_name: yt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yt
      POSTGRES_PASSWORD: yt_password
      POSTGRES_DB: youtube_clone
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ stores data in a versioned subfolder; mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yt -d youtube_clone"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: yt-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: creates buckets, then exits.
  minio-setup:
    image: minio/mc:latest
    container_name: yt-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./minio/hls-read-policy.json:/policies/hls-read.json:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/raw-videos &&
      mc mb --ignore-existing local/hls-videos &&
      mc anonymous set-json /policies/hls-read.json local/hls-videos &&
      echo 'Buckets ready: raw-videos (private), hls-videos (anonymous GetObject only, no listing)'
      "

  # Edge cache in front of hls-videos (Stage 3); players use http://localhost:8088/hls-videos/...
  edge:
    image: nginx:1.26.3
    container_name: yt-edge
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "8088:8080"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./edge/hls-edge.conf:/etc/nginx/edge/hls-edge.conf:ro
      - ./edge/hls-proxy.conf:/etc/nginx/edge/hls-proxy.conf:ro
      - edge-cache:/var/cache/nginx
    healthcheck:
      # The RHEL image ships curl, Alpine-based ones wget.
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/healthz || wget -qO- http://127.0.0.1:8080/healthz",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  keycloak:
    image: keycloak/keycloak:latest
    container_name: yt-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8180
      # Fixed hostname keeps the token issuer identical for browser and services.
      KC_HOSTNAME: http://localhost:8180
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  rabbitmq:
    image: rabbitmq:3.12.13-management
    container_name: yt-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: yt
      RABBITMQ_DEFAULT_PASS: yt_password
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
    volumes:
      # Queues and messages survive a restart; the node name must stay fixed for that.
      - rabbitmq-data:/var/lib/rabbitmq
    hostname: yt-rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6

volumes:
  postgres-data:
  minio-data:
  rabbitmq-data:
  edge-cache:
