name: youtube-clone-local

services:
  postgres:
    image: postgres:latest
    container_name: yt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yt
      POSTGRES_PASSWORD: yt_password
      POSTGRES_DB: youtube_clone
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ stores data in a versioned subfolder; mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yt -d youtube_clone"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: yt-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: creates buckets, then exits.
  minio-setup:
    image: minio/mc:latest
    container_name: yt-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./minio/hls-read-policy.json:/policies/hls-read.json:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/raw-videos &&
      mc mb --ignore-existing local/hls-videos &&
      mc anonymous set-json /policies/hls-read.json local/hls-videos &&
      echo 'Buckets ready: raw-videos (private), hls-videos (anonymous GetObject only, no listing)'
      "

  # Edge cache in front of hls-videos (Stage 3); players use http://localhost:8088/hls-videos/...
  edge:
    image: nginx:1.26.3
    container_name: yt-edge
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "8088:8080"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./edge/hls-edge.conf:/etc/nginx/edge/hls-edge.conf:ro
      - ./edge/hls-proxy.conf:/etc/nginx/edge/hls-proxy.conf:ro
      - edge-cache:/var/cache/nginx
    healthcheck:
      # The RHEL image ships curl, Alpine-based ones wget.
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/healthz || wget -qO- http://127.0.0.1:8080/healthz",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  keycloak:
    image: keycloak/keycloak:latest
    container_name: yt-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8180
      # Fixed hostname keeps the token issuer identical for browser and services.
      KC_HOSTNAME: http://localhost:8180
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  rabbitmq:
    image: rabbitmq:3.12.13-management
    container_name: yt-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: yt
      RABBITMQ_DEFAULT_PASS: yt_password
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
    volumes:
      # Queues and messages survive a restart; the node name must stay fixed for that.
      - rabbitmq-data:/var/lib/rabbitmq
    hostname: yt-rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6

  # Event log for fan-out (Stage 4). Single KRaft node: broker and controller, no ZooKeeper.
  kafka:
    image: bitnami/kafka:3.5.1
    container_name: yt-kafka
    restart: unless-stopped
    environment:
      # Fixed id so the data volume stays valid across container re-creates.
      KAFKA_KRAFT_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL for containers, EXTERNAL (localhost:9094) for services on the host.
      KAFKA_CFG_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Topics are created on purpose by kafka-setup, never by a typo in a client.
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10

  # One-shot: creates topics, then exits. Keyed by videoId, so one video's events stay in order.
  kafka-setup:
    image: bitnami/kafka:3.5.1
    container_name: yt-kafka-setup
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/bash -c "
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic yt.video-events
      --partitions 3 --replication-factor 1 --config cleanup.policy=compact --config min.compaction.lag.ms=86400000 &&
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic yt.video-events.dlt
      --partitions 1 --replication-factor 1 --config retention.ms=1209600000 &&
      echo 'Topics ready: yt.video-events (3 partitions, compacted), yt.video-events.dlt (14 days)'
      "

  # Search index (Stage 4). Security off: local only, nothing but the search-service writes to it.
  elasticsearch:
    image: elasticsearch:8.19.16
    container_name: yt-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      cluster.name: yt-local
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      # A nearly full laptop disk would otherwise make every index read-only.
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null",
        ]
      interval: 10s
      timeout: 10s
      retries: 12

  # Cache + view counters (Stage 5). volatile-lru: only keys with a TTL (the cache) may be evicted,
  # never the view counters, which have none and are flushed to Postgres.
  redis:
    image: redis:6.2.24
    container_name: yt-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "volatile-lru",
      ]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  minio-data:
  rabbitmq-data:
  edge-cache:
  kafka-data:
  elasticsearch-data:
  redis-data:
