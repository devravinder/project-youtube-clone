name: youtube-clone-local

# Local development infrastructure for Phase 0: Postgres + MinIO.
# More services (RabbitMQ, Kafka, Elasticsearch, Keycloak) are added in later phases.
# Start:  pnpm start:l:pods     Stop: pnpm stop:l:pods     Logs: pnpm logs:l

services:
  postgres:
    image: postgres:17-alpine
    container_name: yt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yt
      POSTGRES_PASSWORD: yt_password
      POSTGRES_DB: youtube_clone
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yt -d youtube_clone"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: yt-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot job: create the buckets the app expects, then exit.
  minio-setup:
    image: minio/mc:latest
    container_name: yt-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/raw-videos &&
      mc mb --ignore-existing local/hls-videos &&
      echo 'Buckets ready: raw-videos, hls-videos'
      "

volumes:
  postgres-data:
  minio-data:
