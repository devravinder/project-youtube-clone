name: youtube-clone-local

# Everything in the local stack, plus one all-in-one telemetry backend (Stage 6).
include:
  - docker-compose-local.yaml

services:
  # OpenTelemetry Collector + Tempo (traces) + Prometheus (metrics) + Loki (logs) + Grafana in one container.
  # Services push OTLP to the collector; nothing scrapes them. Data lives in the container: a restart clears it.
  lgtm:
    image: grafana/otel-lgtm:1.3
    container_name: yt-lgtm
    restart: unless-stopped
    ports:
      - "3000:3000" # Grafana (admin / admin)
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    volumes:
      # Our dashboards, beside the image's own RED and JVM ones: Grafana → Dashboards → Mini YouTube.
      - ./observability/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/yt-dashboards.yaml:ro
      - ./observability/dashboards:/otel-lgtm/yt-dashboards:ro
    healthcheck:
      # run-all.sh touches /tmp/ready once Grafana, Loki, Tempo, Prometheus and the collector are up.
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 60
