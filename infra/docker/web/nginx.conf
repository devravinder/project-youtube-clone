# Template: entrypoint.sh replaces the __*_URL__ placeholders. Whole config, as in infra/edge.
user nginx;
worker_processes auto;
error_log /dev/stderr notice;
pid /run/nginx.pid;
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    access_log /dev/stdout;

    # Upgrade only when the browser asks for it (the /ws socket).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    server {
        listen 8080;
        root /usr/share/nginx/yt-web;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # The trailing slash strips the prefix, like the Vite proxy's rewrite.
        location /api/ {
            proxy_pass __UPLOAD_SERVICE_URL__/;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Large multipart uploads go straight to storage; API bodies are small.
            client_max_body_size 1m;
        }

        location /search-api/ {
            proxy_pass __SEARCH_SERVICE_URL__/;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /ws {
            proxy_pass __NOTIFICATION_SERVICE_URL__;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Above the 30 s server ping, so idle sockets are not cut.
            proxy_read_timeout 120s;
        }

        # Hashed file names never change: cache for a year.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Client-side routes (/watch/..., /search) all load the app.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri /index.html;
        }
    }
}
