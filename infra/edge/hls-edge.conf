# Edge cache for HLS output: players fetch playlists and segments here, not from MinIO.
# Included into the http block by infra/edge/nginx.conf.

proxy_cache_path /var/cache/nginx/hls levels=1:2 keys_zone=hls:20m max_size=2g inactive=7d
                 use_temp_path=off;

log_format edge '$remote_addr "$request" $status cache=$upstream_cache_status '
                'bytes=$body_bytes_sent upstream=$upstream_response_time range="$http_range"';

upstream minio {
    server minio:9000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    access_log /dev/stdout edge;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Segments never change once written (keys are fixed and the transcoder skips finished videos).
    location ~ ^/hls-videos/[^/]+/hls/[^/]+/seg_\d+\.ts$ {
        set $edge_cache_control "public, max-age=31536000, immutable";
        proxy_cache_valid 200 30d;
        include /etc/nginx/edge/hls-proxy.conf;
    }

    # Short TTL so a deleted or re-encoded video disappears for new viewers within a minute.
    location ~ ^/hls-videos/[^/]+/hls/(master|[^/]+/index)\.m3u8$ {
        set $edge_cache_control "public, max-age=60";
        proxy_cache_valid 200 60s;
        include /etc/nginx/edge/hls-proxy.conf;
    }

    # Nothing else is served: no bucket listing, no raw videos, no manifest.json.
    location / {
        return 404;
    }
}
