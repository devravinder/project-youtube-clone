# Whole config, so the image's own default server (also on 8080) is not loaded.
# Works with the RHEL-based image and the official nginx image alike.
user nginx;
worker_processes auto;
error_log /dev/stderr notice;
pid /run/nginx.pid;

# RHEL loads dynamic modules from here; elsewhere the glob matches nothing.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    include /etc/nginx/edge/hls-edge.conf;
}
