# Shared by the segment and playlist locations; each sets $edge_cache_control and proxy_cache_valid.

# CORS preflight (a player sending Range from another origin); answered here, never cached upstream.
if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin "*";
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
    add_header Access-Control-Allow-Headers "Range";
    add_header Access-Control-Max-Age 86400;
    return 204;
}
# GET also allows HEAD; OPTIONS must be listed, or it lands in this block and misses the 204 above.
limit_except GET OPTIONS {
    deny all;
}

proxy_pass http://minio;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host minio:9000;
# Anonymous objects: credentials or cookies must neither reach MinIO nor split the cache.
proxy_set_header Authorization "";
proxy_set_header Cookie "";

proxy_cache hls;
# Public objects carry no signature, so the query string only fragments the cache.
proxy_cache_key $uri;
proxy_cache_valid 404 10s;
# One upstream fetch per object, however many viewers ask at once.
proxy_cache_lock on;
proxy_cache_lock_timeout 10s;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
proxy_cache_revalidate on;
proxy_ignore_headers Set-Cookie Cache-Control Expires Vary;
# With caching on, nginx fetches the whole object and cuts byte ranges from the cached copy.
proxy_force_ranges on;

# MinIO echoes the request Origin; a cached echo would be wrong for the next site, so replace it.
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Expose-Headers;
proxy_hide_header Vary;
proxy_hide_header Cache-Control;
proxy_hide_header Set-Cookie;
proxy_hide_header Server;
proxy_hide_header X-Amz-Id-2;
proxy_hide_header X-Amz-Request-Id;

add_header Cache-Control $edge_cache_control always;
add_header Access-Control-Allow-Origin "*" always;
add_header Access-Control-Expose-Headers "Content-Length, Content-Range, X-Cache-Status" always;
add_header X-Cache-Status $upstream_cache_status always;
