# Defaults for upload-service; the umbrella chart's values override them.
replicaCount: 1
image:
  pullPolicy: "IfNotPresent"
  repository: "yt/upload-service"
service:
  type: "ClusterIP"
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
terminationGracePeriodSeconds: 30
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
port: 3001
probes:
  path: "/videos?limit=1"
  startupFailureThreshold: 24
resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    memory: "512Mi"
migrations:
  enabled: true
env:
  PORT: "3001"
  TRUST_PROXY_HOPS: "1"
secretEnv: {}
