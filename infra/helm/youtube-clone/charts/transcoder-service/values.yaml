# Defaults for transcoder-service; the umbrella chart's values override them.
replicaCount: 1
image:
  pullPolicy: "IfNotPresent"
  repository: "yt/transcoder-service"
service:
  type: "ClusterIP"
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
terminationGracePeriodSeconds: 600
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80
port: 3002
probes:
  path: "/actuator/health"
  startupFailureThreshold: 36
resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    memory: "1536Mi"
queueScaling:
  enabled: false
  queue: "transcoder.transcode-video"
  messagesPerReplica: 2
  minReplicas: 1
  maxReplicas: 8
env:
  SPRING_PROFILES_ACTIVE: "local"
  SERVER_PORT: "3002"
secretEnv: {}
